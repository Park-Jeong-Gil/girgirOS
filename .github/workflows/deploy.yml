name: Deploy to Synology NAS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # run: npm install
        run: npm ci
        
      - name: Check build directory
        run: |
          if [ -d "build" ]; then
            echo "Cleaning existing build directory"
            rm -rf build
          fi

      - name: Build project
        run: npm run build
        
      - name: Create backup on NAS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            timestamp=$(date +%Y%m%d_%H%M%S)
            TARGET_DIR="${{ secrets.TARGET_DIRECTORY }}"
            BACKUP_ROOT="${TARGET_DIR}/backups"
            BACKUP_DIR="${BACKUP_ROOT}/backup_${timestamp}"
            
            # 디렉토리 생성 (sudo 제거)
            mkdir -p "${BACKUP_DIR}" || exit 1
            
            # 디스크 공간 확인 (sudo 제거)
            if [ $(df -P "${BACKUP_ROOT}" | awk 'NR==2 {print $5}' | sed 's/%//') -gt 90 ]; then
              find "${BACKUP_ROOT}" -name "backup_*" -type d -mtime +7 -exec rm -rf {} \;
            fi
            
            # 안전한 복사 (sudo 제거)
            rsync -av --include='index.html' --include='resources/***' --exclude='*' "${TARGET_DIR}/" "${BACKUP_DIR}/" || {
              echo "백업 실패"
              rm -rf "${BACKUP_DIR}"
              exit 1
            }
            echo "백업 완료: ${BACKUP_DIR}"

      - name: Deploy to NAS
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "build/*"
          target: ${{ secrets.TARGET_DIRECTORY }}
          strip_components: 1
        
        - name: Fix target directory permissions
          uses: appleboy/ssh-action@v1.0.0
          with:
            host: ${{ secrets.SSH_HOST }}
            port: ${{ secrets.SSH_PORT }}
            username: ${{ secrets.SSH_USERNAME }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            script: |
              chmod -R 755 ${{ secrets.TARGET_DIRECTORY }}/resources

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # 백업 디렉토리에서 가장 최신 백업 찾기
            BACKUP_DIR=$(ls -td ${{ secrets.TARGET_DIRECTORY }}/backups/backup_* | head -1)
            
            if [ ! -f "${{ secrets.TARGET_DIRECTORY }}/index.html" ]; then
              echo "Deployment verification failed - rolling back"
              if [ -n "${BACKUP_DIR}" ] && [ -d "${BACKUP_DIR}" ]; then
                rm -rf ${{ secrets.TARGET_DIRECTORY }}/*
                cp -r "${BACKUP_DIR}/"* "${{ secrets.TARGET_DIRECTORY }}/" || exit 1
                echo "Rollback completed using ${BACKUP_DIR}"
              else
                echo "Backup not found for rollback"
                exit 1
              fi
            else
              echo "Deployment verified successfully"
            fi
            # 오래된 백업 정리
            find "${{ secrets.TARGET_DIRECTORY }}/backups" -name "backup_*" -type d -mtime +7 -exec rm -rf {} \;