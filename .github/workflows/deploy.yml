name: Deploy to Synology NAS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # run: npm install
        run: npm ci
        
      - name: Check build directory
        run: |
          if [ -d "build" ]; then
            echo "Cleaning existing build directory"
            rm -rf build
          fi

      - name: Build project
        run: npm run build
        
      - name: Create backup on NAS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            timestamp=$(date +%Y%m%d_%H%M%S)
            cd ${{ secrets.TARGET_DIRECTORY }}
            if [ -d "backup" ]; then
              rm -rf backup_old
              mv backup backup_old
            fi
            cp -r . backup_$timestamp

      - name: Deploy to NAS
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "build/*"
          target: ${{ secrets.TARGET_DIRECTORY }}
          strip_components: 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # 백업 디렉토리 확인
            if [ -d "${{ secrets.TARGET_DIRECTORY }}/backups" ]; then
              BACKUP_DIR=$(ls -td ${{ secrets.TARGET_DIRECTORY }}/backups/backup_* 2>/dev/null | head -1)
            fi
            
            # 배포 확인
            if [ ! -f "${{ secrets.TARGET_DIRECTORY }}/index.html" ]; then
              echo "Deployment verification failed - rolling back"
              if [ -n "${BACKUP_DIR}" ] && [ -d "${BACKUP_DIR}" ]; then
                sudo rm -rf ${{ secrets.TARGET_DIRECTORY }}/* 2>/dev/null || true
                sudo cp -r "${BACKUP_DIR}/"* "${{ secrets.TARGET_DIRECTORY }}/" 2>/dev/null || exit 1
                echo "Rollback completed using ${BACKUP_DIR}"
              else
                echo "Backup not found for rollback"
                exit 1
              fi
            else
              echo "Deployment verified successfully"
            fi
            
            # 오래된 백업 정리 (에러 무시)
            find "${{ secrets.TARGET_DIRECTORY }}/backups" -name "backup_*" -type d -mtime +7 -exec rm -rf {} \; 2>/dev/null || true