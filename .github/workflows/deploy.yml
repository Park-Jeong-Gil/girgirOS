name: Deploy to Synology NAS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # run: npm install
        run: npm ci
        
      - name: Check build directory
        run: |
          if [ -d "build" ]; then
            echo "Cleaning existing build directory"
            rm -rf build
          fi

      - name: Build project
        run: npm run build
        
      - name: Create backup on NAS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            timestamp=$(date +%Y%m%d_%H%M%S)
            cd ${{ secrets.TARGET_DIRECTORY }}
            
            # 백업 생성 전 디스크 공간 확인
            if [ $(df -P . | awk 'NR==2 {print $5}' | sed 's/%//') -gt 90 ]; then
              echo "Low disk space warning"
              # 7일 이상 된 백업 정리
              find . -name "backup_*" -type d -mtime +7 -exec rm -rf {} \;
            fi
            
            # 백업 생성
            if cp -r . backup_$timestamp; then
              echo "Backup created successfully"
            else
              echo "Backup creation failed"
              exit 1
            fi

      - name: Deploy to NAS
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "build/*"
          target: ${{ secrets.TARGET_DIRECTORY }}
          strip_components: 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            if [ ! -f "${{ secrets.TARGET_DIRECTORY }}/index.html" ]; then
              echo "Deployment verification failed - rolling back"
              if [ -d "backup_$timestamp" ]; then
                rm -rf ${{ secrets.TARGET_DIRECTORY }}/*
                cp -r backup_$timestamp/* ${{ secrets.TARGET_DIRECTORY }}/ || {
                  echo "Rollback failed"
                  exit 2
                }
                echo "Rollback completed successfully"
                # 오래된 백업 정리 (7일 이상)
                find . -name "backup_*" -type d -mtime +7 -exec rm -rf {} \;
              else
                echo "Backup not found for rollback"
                exit 1
              fi
            else
              echo "Deployment verified successfully"
              # 성공적인 배포 후 알림 (선택사항)
              echo "::notice::Deployment completed successfully at $(date)"
            fi