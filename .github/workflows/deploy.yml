name: Deploy to Synology NAS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        # run: npm install
        run: npm ci
        
      - name: Check build directory
        run: |
          if [ -d "build" ]; then
            echo "Cleaning existing build directory"
            rm -rf build
          fi

      - name: Build project
        run: npm run build
        
      - name: Create backup on NAS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # timestamp 생성
            timestamp=$(date +%Y%m%d_%H%M%S)
            
            # backups 디렉토리 생성
            mkdir -p "${{ secrets.TARGET_DIRECTORY }}/backups"
            
            # 현재 운영중인 파일들 백업
            if [ -f "${{ secrets.TARGET_DIRECTORY }}/index.html" ]; then
              mkdir -p "${{ secrets.TARGET_DIRECTORY }}/backups/backup_${timestamp}"
              cp "${{ secrets.TARGET_DIRECTORY }}/index.html" "${{ secrets.TARGET_DIRECTORY }}/backups/backup_${timestamp}/"
              
              if [ -d "${{ secrets.TARGET_DIRECTORY }}/resources" ]; then
                cp -r "${{ secrets.TARGET_DIRECTORY }}/resources" "${{ secrets.TARGET_DIRECTORY }}/backups/backup_${timestamp}/"
              fi
            fi

      - name: Deploy to NAS
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "build/*"
          target: ${{ secrets.TARGET_DIRECTORY }}
          strip_components: 1

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            if [ ! -f "${{ secrets.TARGET_DIRECTORY }}/index.html" ]; then
              echo "Deployment verification failed - rolling back"
              
              # 가장 최신 백업 찾기
              LATEST_BACKUP=$(ls -td ${{ secrets.TARGET_DIRECTORY }}/backups/backup_* | head -1)
              
              if [ -n "$LATEST_BACKUP" ]; then
                # index.html 복원
                cp "$LATEST_BACKUP/index.html" "${{ secrets.TARGET_DIRECTORY }}/"
                
                # resources 폴더 복원
                if [ -d "$LATEST_BACKUP/resources" ]; then
                  rm -rf "${{ secrets.TARGET_DIRECTORY }}/resources"
                  cp -r "$LATEST_BACKUP/resources" "${{ secrets.TARGET_DIRECTORY }}/"
                fi
                
                echo "Rollback completed using $LATEST_BACKUP"
              else
                echo "No backup found for rollback"
                exit 1
              fi
            else
              echo "Deployment verified successfully"
            fi
            
            # 7일 이상된 백업 삭제
            find "${{ secrets.TARGET_DIRECTORY }}/backups" -name "backup_*" -type d -mtime +7 -exec rm -rf {} \; 2>/dev/null || true